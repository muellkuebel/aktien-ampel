name: Update Aktien Ampel data

on:
  schedule:
    - cron: "0,30 6-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data and compute signals
        run: python scripts/update_data.py
      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No data.json changes"
          else
            git commit -m "chore: update data.json $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
